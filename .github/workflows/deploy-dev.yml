# Manual-only deployment of the isolated DEV frontend (Phase C2: prepared,
# INERT — the GitHub `dev` environment, its secrets, and the recoveryos-dev
# Worker do not exist until Phase C3 is separately authorized; every gate below
# fails closed until then).
#
# DEV is the ONLY target this workflow can reach:
#   * it deploys exclusively with wrangler.dev.jsonc (Worker name recoveryos-dev);
#   * it refuses to run if the DEV Supabase URL is missing, malformed, or equal
#     to the production project;
#   * it greps the built assets and fails if they reference the production
#     project or omit the DEV project — the inverse of the production gates;
#   * wrong inputs cannot retarget it: no input names a Worker, config, or URL.
name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact commit SHA or reviewed release ref to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_DEV
        required: true
        type: string

concurrency:
  group: recoveryos-dev
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-dev:
    if: ${{ inputs.confirmation == 'DEPLOY_DEV' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
      DEV_SUPABASE_ANON_KEY: ${{ vars.DEV_SUPABASE_ANON_KEY }}
      # Production project ref, used ONLY for refusal checks below.
      PROD_REF: cqcxvwoukyhxyokfwnjm
    steps:
      - name: Require DEV credentials and refuse production references
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::DEV deployment is not provisioned (Phase C3): Cloudflare credentials absent from the dev environment."
            exit 1
          fi
          if [[ ! "$DEV_SUPABASE_URL" =~ ^https://[a-z]{20}\.supabase\.co$ ]]; then
            echo "::error::DEV_SUPABASE_URL missing or malformed; refusing."
            exit 1
          fi
          if [[ "$DEV_SUPABASE_URL" == *"$PROD_REF"* ]]; then
            echo "::error::DEV deployment may NEVER target the production Supabase project."
            exit 1
          fi
          if [ -z "$DEV_SUPABASE_ANON_KEY" ]; then
            echo "::error::DEV_SUPABASE_ANON_KEY missing; refusing."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Resolve immutable release SHA
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require successful CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successes=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=success" --jq '.total_count')
          if [ "${successes:-0}" -eq 0 ]; then
            echo "::error::No successful CI run exists for commit $RELEASE_SHA. Deploy only CI-green commits."
            exit 1
          fi
      - name: Require the DEV wrangler config to be the DEV Worker with no domains
        run: |
          node -e '
            const t = require("fs").readFileSync("wrangler.dev.jsonc", "utf8");
            const stripped = t.replace(/\/\/.*$/gm, "");
            if (!/"name"\s*:\s*"recoveryos-dev"/.test(stripped)) { console.error("wrangler.dev.jsonc must name recoveryos-dev"); process.exit(1); }
            if (/routes|custom_domain/.test(stripped)) { console.error("wrangler.dev.jsonc must not declare routes or custom domains"); process.exit(1); }
          '
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build platform against the DEV backend
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.DEV_SUPABASE_ANON_KEY }}
          VITE_RELEASE: ${{ env.RELEASE_SHA }}
          # Cloudflare's official always-pass Turnstile TEST site key — DEV only.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - name: Enforce DEV backend in built assets (inverse of the production gates)
        run: |
          RETIRED_REF='ykykeioydvtxpyreshhs'
          DEV_REF=$(echo "$DEV_SUPABASE_URL" | sed -E 's#https://([a-z]{20})\.supabase\.co#\1#')
          if grep -R -n --fixed-strings "$PROD_REF" apps/platform/dist; then
            echo "::error::Built DEV assets reference the PRODUCTION project; refusing to deploy."
            exit 1
          fi
          if grep -R -n --fixed-strings "$RETIRED_REF" apps/platform/dist; then exit 1; fi
          grep -R -q --fixed-strings "$DEV_REF" apps/platform/dist
      - name: Deploy recoveryos-dev
        run: pnpm dlx wrangler@4.14.0 deploy --config wrangler.dev.jsonc
      - name: Record deployment
        run: |
          echo "DEV Worker: recoveryos-dev (workers.dev hostname only)" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: $DEV_SUPABASE_URL (DEV)" >> "$GITHUB_STEP_SUMMARY"
          echo "Production Workers, domains, and CQCX: untouched by this workflow" >> "$GITHUB_STEP_SUMMARY"
