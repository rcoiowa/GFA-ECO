# Deploys the RecoveryOS platform to the recoveryos-staging Worker on every
# push to the build branch (config: root wrangler.jsonc). Requires a Cloudflare API token ("Edit Cloudflare
# Workers" template) named CLOUDFLARE_API_TOKEN, provided as a repository
# secret, a repository variable, or a secret on the "production" environment.
name: Deploy staging

on:
  push:
    branches:
      - claude/recoveryos-greenfield-build-8pns7n
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check token is present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it on github.com/rcoiowa/GFA-ECO under Settings -> Secrets and variables -> Actions -> 'Repository secrets' (New repository secret), named exactly CLOUDFLARE_API_TOKEN. The Variables tab and a 'production' environment secret also work; Codespaces/Dependabot secrets do not."
            exit 1
          fi
          echo "Token present (length ${#CLOUDFLARE_API_TOKEN})."

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build platform
        run: pnpm build
        env:
          # Publishable values (RLS is the data boundary)
          VITE_SUPABASE_URL: https://ykykeioydvtxpyreshhs.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_9NOklH5Dvj3PcQs2dCLdpg_zx4txe8a

      - name: Deploy to Cloudflare
        run: npx wrangler@4 deploy
