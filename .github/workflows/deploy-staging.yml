# Manual-only deployment of the active staging pilot. Branch pushes must never deploy.
name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact commit SHA or reviewed release ref to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_STAGING
        required: true
        type: string

concurrency:
  group: recoveryos-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_STAGING' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require Cloudflare deployment credentials
        run: |
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID in the staging environment to the 32-character Cloudflare account ID."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Resolve immutable release SHA
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require successful CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successes=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=success" --jq '.total_count')
          if [ "${successes:-0}" -eq 0 ]; then
            echo "::error::No successful CI run exists for commit $RELEASE_SHA. Deploy only CI-green commits."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require housing application challenge configuration
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$VITE_TURNSTILE_SITE_KEY" ]; then
            echo "::error::Set VITE_TURNSTILE_SITE_KEY and the matching residence-intake TURNSTILE_SECRET before deploying public housing applications."
            exit 1
          fi
      - name: Build platform (canonical RecoveryOS-Launch backend)
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://cqcxvwoukyhxyokfwnjm.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_OMRkXXJ71z9RlUIAAfy2Jw_h04TYK3x
          VITE_RELEASE: ${{ env.RELEASE_SHA }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Enforce canonical backend in staging assets
        run: |
          RETIRED_REF='ykykeioydvtxpyreshhs'
          CANONICAL_REF='cqcxvwoukyhxyokfwnjm'
          if grep -R -n --fixed-strings "$RETIRED_REF" apps/platform/dist; then exit 1; fi
          grep -R -q --fixed-strings "$CANONICAL_REF" apps/platform/dist
      - name: Deploy recoveryos-staging
        run: pnpm dlx wrangler@4.14.0 deploy --config wrangler.staging.jsonc
      - name: Record deployment
        run: echo "Deployed immutable commit $RELEASE_SHA to recoveryos-staging at $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
