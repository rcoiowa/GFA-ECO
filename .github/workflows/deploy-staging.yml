# Deploys the RecoveryOS platform to the NON-PRODUCTION `recoveryos-staging`
# Worker (config: wrangler.staging.jsonc — never the production-candidate
# Worker and never vrcc.app). Publishable Supabase configuration comes from
# repository/environment variables with the canonical RecoveryOS-Launch
# values as fallback, so staging can never silently drift back to a retired
# project. Requires CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers"
# template) as a repository secret/variable or on the "production"
# environment.
name: Deploy staging

on:
  push:
    branches:
      - claude/grace-coaching-audit-b0fyhq
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check token is present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it on github.com/rcoiowa/GFA-ECO under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build platform (RecoveryOS-Launch publishable config)
        run: pnpm build
        env:
          # Publishable values (RLS is the data boundary). Overridable via
          # repository variables; fallback is the canonical launch project —
          # NEVER the retired ykykeioydvtxpyreshhs project.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_URL || 'https://cqcxvwoukyhxyokfwnjm.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY != '' && vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_OMRkXXJ71z9RlUIAAfy2Jw_h04TYK3x' }}
          VITE_RELEASE: ${{ github.sha }}

      - name: Deploy to Cloudflare (recoveryos-staging)
        run: npx wrangler@4 deploy --config wrangler.staging.jsonc

      - name: Record deployment
        run: |
          echo "Deployed commit ${{ github.sha }} to recoveryos-staging at $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
