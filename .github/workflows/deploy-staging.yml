# Deploys the RecoveryOS platform to the recoveryos-staging Worker on every
# push to the build branch. Requires the CLOUDFLARE_API_TOKEN repository
# secret (Cloudflare dashboard -> My Profile -> API Tokens -> "Edit
# Cloudflare Workers" template; add under GitHub repo Settings -> Secrets
# and variables -> Actions).
name: Deploy staging

on:
  push:
    branches:
      - claude/recoveryos-greenfield-build-ka6992
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build platform
        run: pnpm --filter @recoveryos/platform build
        env:
          # Publishable values (RLS is the data boundary)
          VITE_SUPABASE_URL: https://ykykeioydvtxpyreshhs.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_9NOklH5Dvj3PcQs2dCLdpg_zx4txe8a

      - name: Deploy to Cloudflare
        working-directory: apps/platform
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
