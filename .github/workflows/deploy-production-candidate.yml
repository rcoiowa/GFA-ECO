name: Deploy development/testing

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact commit SHA or reviewed release ref to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_DEVELOPMENT
        required: true
        type: string

concurrency:
  group: recoveryos-development
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-development:
    if: ${{ inputs.confirmation == 'DEPLOY_DEVELOPMENT' }}
    runs-on: ubuntu-latest
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      DEVELOPMENT_SUPABASE_REF: ${{ vars.DEVELOPMENT_SUPABASE_REF }}
      VITE_SUPABASE_URL: ${{ vars.DEVELOPMENT_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.DEVELOPMENT_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.DEVELOPMENT_TURNSTILE_SITE_KEY }}
    steps:
      - name: Require Cloudflare deployment token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Resolve immutable release SHA
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require successful CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successes=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=success" --jq '.total_count')
          if [ "${successes:-0}" -eq 0 ]; then
            echo "::error::No successful CI run exists for commit $RELEASE_SHA. Deploy only CI-green commits."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate development isolation rules
        run: node --test scripts/development-config.test.mjs
      - name: Build isolated development assets
        run: node scripts/build-development.mjs
        env:
          VITE_RELEASE: ${{ env.RELEASE_SHA }}
      - name: Verify development Worker target
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c = JSON.parse(fs.readFileSync('wrangler.development.json', 'utf8')); if(c.name !== 'gfa-eco-recovery-residence-os' || c.routes || c.env || c.assets.directory !== './apps/platform/dist') throw Error('Unexpected development target');"
      - name: Deploy development Worker
        run: pnpm dlx wrangler@4.14.0 deploy --config wrangler.development.json
      - name: Record development deployment
        run: |
          echo "Development Worker: gfa-eco-recovery-residence-os" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: $DEVELOPMENT_SUPABASE_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Live Wix embed and DNS: unchanged" >> "$GITHUB_STEP_SUMMARY"
