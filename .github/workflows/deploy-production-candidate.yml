name: Deploy production candidate

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact commit SHA or reviewed release ref to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_CANDIDATE
        required: true
        type: string

concurrency:
  group: recoveryos-production-candidate
  cancel-in-progress: false

jobs:
  deploy-candidate:
    if: ${{ inputs.confirmation == 'DEPLOY_CANDIDATE' }}
    runs-on: ubuntu-latest
    environment: production-candidate
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: https://cqcxvwoukyhxyokfwnjm.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_OMRkXXJ71z9RlUIAAfy2Jw_h04TYK3x
    steps:
      - name: Require Cloudflare deployment token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Resolve immutable release SHA
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_RELEASE: ${{ env.RELEASE_SHA }}
      - name: Enforce canonical backend in candidate assets
        run: |
          RETIRED_REF='ykykeioydvtxpyreshhs'
          CANONICAL_REF='cqcxvwoukyhxyokfwnjm'
          if grep -R -n --fixed-strings "$RETIRED_REF" apps/platform/dist; then exit 1; fi
          grep -R -q --fixed-strings "$CANONICAL_REF" apps/platform/dist
      - name: Deploy canonical production candidate Worker
        run: pnpm dlx wrangler@4.14.0 deploy --config wrangler.jsonc
      - name: Record candidate deployment
        run: |
          echo "Candidate Worker: gfa-eco-recovery-residence-os" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: cqcxvwoukyhxyokfwnjm" >> "$GITHUB_STEP_SUMMARY"
          echo "Domain/DNS cutover: NOT PERFORMED by this workflow" >> "$GITHUB_STEP_SUMMARY"
