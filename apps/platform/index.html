<!doctype html>
<html lang="en" data-brand="original">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Virtual Recovery Community Center — recovery support that meets you where you are. Connection prevents crisis."
    />
    <title>VRCC — Virtual Recovery Community Center</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#24676a" />
    <script>
      // Resolve appearance + atmosphere before first paint (no flash).
      // Mirrors AppearanceControls; migrates the retired 'recoveryos-visual'
      // monolithic-theme preference (dark/space/rcoia → dark; space → cosmic).
      try {
        var pref = localStorage.getItem('recoveryos-appearance');
        var atmo = localStorage.getItem('recoveryos-atmosphere');
        var legacy = localStorage.getItem('recoveryos-visual');
        if (['system', 'light', 'dark'].indexOf(pref) === -1) {
          pref = ['dark', 'space', 'rcoia'].indexOf(legacy) !== -1 ? 'dark' : 'system';
        }
        if (['original', 'hearth', 'cosmic'].indexOf(atmo) === -1) {
          atmo = legacy === 'space' ? 'cosmic' : legacy && legacy !== 'gfa' ? 'hearth' : 'original';
        }
        if (atmo === 'original') document.documentElement.dataset.brand = 'original';
        else delete document.documentElement.dataset.brand;
        var dark =
          atmo === 'cosmic' ||
          pref === 'dark' ||
          (pref === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.appearance = dark ? 'dark' : 'light';
        if (atmo === 'cosmic') document.documentElement.dataset.atmosphere = 'cosmic';
        document.querySelector('meta[name="theme-color"]').content =
          atmo === 'original' ? (dark ? '#0b1d20' : '#24676a') : dark ? '#141019' : '#6540a5';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
