<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Virtual Recovery Community Center — recovery support that meets you where you are. Connection prevents crisis."
    />
    <title>VRCC — Virtual Recovery Community Center</title>
  </head>
  <body>
    <script>
      // Apply the saved visual theme before first paint (no flash).
      try {
        var v = localStorage.getItem('recoveryos-visual');
        if (['dark', 'space', 'sky', 'retro', 'gfa', 'rcoia'].indexOf(v) !== -1) {
          document.documentElement.dataset.visual = v;
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
